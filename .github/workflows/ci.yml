name: modules

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff pyyaml hypothesis
      - name: Run every module's tests
        run: pytest modules -q
      - name: Run every started challenge stage
        run: pytest challenges -q -rs
      - name: Lint
        run: ruff check modules tools challenges
      - name: Check module standard
        run: python tools/status.py --check
      - name: Report ladder progress
        run: python tools/challenges.py --check
